name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Environment and Keystore
        run: |
          # Copy .env.example to .env for secrets plugin
          if [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Generate debug.keystore if missing to satisfy signing config
          if [ ! -f "debug.keystore" ]; then
            echo "Generating CI debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle 9.3.1 wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Exists
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Compute Release Name and Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "name=Release v1.0 (Build #${{ github.run_number }})" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/master' ||
          github.event_name == 'workflow_dispatch'
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
